<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14191e"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M8 1 1 7h2v8h4v-5h2v5h4V7h2z%27 fill=%27%23e0a95a%27/%3E%3C/svg%3E"><link rel="stylesheet" href="/css/site.css">
<meta name="robots" content="noindex">
<title>Shared project — Home View</title>
</head><body>
<main>
  <div class="row"><div><div class="muted" style="font-size:13px">Shared project · read-only</div><h1 id="title">Loading…</h1></div><span class="spacer"></span><a class="btn primary" id="open3d" style="display:none">Open in 3D ↗</a></div>
  <div class="err" id="err"></div>
  <div id="body" style="display:none">
    <div id="noModel" class="notice" style="margin:12px 0;display:none">This project doesn't have a 3D model yet, so its images are shown below.</div>
    <section class="card" id="notesCard" style="margin:14px 0;display:none"><h2>Notes</h2><div id="notes" style="white-space:pre-wrap"></div></section>
    <section class="card"><h2>Images</h2><div class="gallery" id="gallery"></div></section>
  </div>
</main>
<footer>Made with <a href="/">Home View</a></footer>
<script type="module">
import { $, api, me, header, renderGallery } from '/js/common.js';
const token = new URLSearchParams(location.search).get('t') || location.pathname.split('/').pop();
header(await me());
const enc = encodeURIComponent;
try {
  const { project: P } = await api('share/' + enc(token));
  document.title = P.name + ' — Home View';
  $('#title').textContent = P.name;
  const model = P.files.find(f => f.kind === 'model');
  if (model || P.exampleId) { $('#open3d').style.display = ''; $('#open3d').href = '/viewer?s=' + enc(token); } else $('#noModel').style.display = '';
  if (P.notes) { $('#notesCard').style.display = ''; $('#notes').textContent = P.notes; }
  renderGallery($('#gallery'), P, f => `/api/share/${enc(token)}/files/${enc(f.id)}`);
  $('#body').style.display = '';
} catch (e) { $('#title').textContent = 'Link not available'; $('#err').textContent = e.message; }
</script>
</body></html>
